[[skill]]
id = "resume"
titre = "Resume de conversation"
priorite = 85
quand = [
  "resume notre conversation", "resume la conversation",
  "de quoi parlions nous", "de quoi on parlait", "resume nos echanges",
]
motif = "(?i)(?:resume|resumer).*(?:conversation|echanges|discussion)|de quoi (?:a t on|on a|avons nous) parle"
handler = "resume"

[[skill]]
id = "code"
titre = "Code executable"
priorite = 50
quand = [
  "corrige ce code", "corrige le code", "code python",
  "ecris une fonction", "ecris un script", "ecris du code", "palindrome",
  "for i in", "def ", "traceback", "erreur de syntaxe",
]
instructions = "CODE — Le code doit être exécutable tel quel. Pour une correction, change le minimum et vérifie la syntaxe (deux-points, indentation, parenthèses). N'invente jamais d'appel à une fonction qui n'existe pas. Pour un palindrome, ignore casse, espaces et ponctuation avant de comparer."

[[skill]]
id = "sources"
titre = "Ancrage sur les sources"
priorite = 45
contexte = "web"
instructions = "SOURCES — Des extraits sont fournis. Réponds à partir d'eux, cite-les, et n'ajoute aucun chiffre, date ou version absent des extraits. Si l'extrait ne contient pas la réponse (une page météo sans valeur, par exemple), dis-le au lieu de le présenter comme la réponse."

[[skill]]
id = "honnetete"
titre = "Honnêteté factuelle"
priorite = 44
quand = [
  "capitale de la lune", "pese un nuage", "poids d'un nuage",
  "poids d un nuage", "question piege", "question absurde",
  "n'a pas de sens", "n a pas de sens",
]
motif = "(?i)\\bcapitale\\s+(?:de\\s+la\\s+|du\\s+|de\\s+)?(?:lune|soleil|mars|jupiter|saturne|venus|mercure|neptune|uranus|pluton)\\b"
handler = "honnetete"
reconsolider = true
instructions = "HONNÊTETÉ — Si la question est absurde ou sans réponse factuelle, dis-le en une phrase et n'invente ni source ni capitale. Pour un ordre de grandeur, donne une estimation avec ses hypothèses, pas un chiffre présenté comme exact."

[[skill]]
id = "logique"
titre = "Rigueur logique"
priorite = 40
quand = [
  "tous les oiseaux", "tous les chats", "est ce forcement",
  "sophisme", "raisonnement circulaire",
]
instructions = "LOGIQUE — Distingue « tous les A sont B » de « tous les B sont A ». Un contre-exemple suffit. Ne confonds pas affirmation de la conséquence et raisonnement circulaire, et ne prétends pas qu'un papillon a des plumes."
