name: Tests

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  # Les dependances ne sont PLUS ecrites a la main : elles viennent des
  # METADONNEES du projet ([project].dependencies de pyproject.toml) et sont
  # figees par uv.lock. Une liste recopiee ici derive — c'est ainsi que
  # `google-adk`, dependance declaree du projet, a manque et fait echouer
  # tests/test_agents_adk.py a l'import.
  #
  # Verifie : la wheel CPU de llama-cpp-python 0.3.36 est en `py3-none-...`
  # (manylinux2014_x86_64, win_amd64, macosx arm64), donc installable sur les
  # deux OS de la matrice sans compilateur ni Python epingle.
  tests:
    name: ${{ matrix.os }} · py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: uv (Python ${{ matrix.python-version }} + cache)
        uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Verrou a jour (pyproject.toml <-> uv.lock)
        run: uv lock --check

      - name: Dependances (metadonnees du projet, versions figees)
        run: uv sync --frozen

      # LA COUVERTURE EST MESUREE, PAS SEULEMENT ANNONCEE. La config
      # ([tool.coverage] de pyproject.toml) porte la source et les branches,
      # donc `--cov` seul suffit ici. PAS de `--cov-fail-under` : un plancher
      # a 20 % passerait au vert pendant des annees sans rien garantir, et il
      # suffirait d'un test saute (`lm_eval` absent) pour rougir la CI sans
      # qu'aucune ligne ait change. Le chiffre est ecrit dans le journal a
      # chaque run, et c'est ARCHITECTURE.md qui dit quoi en faire.
      - name: "Tests + couverture (ordre ALEATOIRE : un etat partage se voit)"
        env:
          PYTHONIOENCODING: utf-8
        run: uv run --frozen pytest -q --cov --cov-report=term-missing:skip-covered

      - name: Diagnostic (chaque echec pytest devient une annotation visible)
        if: failure()
        shell: bash
        run: |
          uv run --frozen pytest -q --tb=short 2>&1 | tee pytest_sortie.txt || true
          { grep -E "^(FAILED|ERROR) " pytest_sortie.txt || true ; } | head -15 | while IFS= read -r ligne; do
            echo "::error::$ligne"
          done
          { grep -E "^E " pytest_sortie.txt || true ; } | head -15 | while IFS= read -r ligne; do
            echo "::error::$ligne"
          done

  # Le format .aef est la signature du projet : on verifie sa chaine
  # complete (forge → signature → boot) sur Linux, où elle n'a jamais tourne
  chaine-aef:
    name: Chaine .aef (forge → signature → boot)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Dependances (metadonnees du projet)
        run: uv sync --frozen

      - name: Forge + signature + boot d'un mini .aef (faux GGUF)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          uv run --frozen python - <<'PY'
          import os, tempfile
          from pathlib import Path
          from scripts.forger_aef import forger
          from aura import signature, kernel

          tmp = Path(tempfile.mkdtemp())
          faux = tmp / "faux.gguf"
          faux.write_bytes(bytes(range(256)) * 4096)   # 1 Mo
          aef = tmp / "ci.aef"

          # 1. forge (profil_materiel a un repli portable hors Windows)
          forger(faux, aef)

          # 2. signature par une cle de test (la cle de confiance du code
          #    est neutralisee : en CI, la cle reelle n'existe pas)
          import aura.signature as sig
          sig._CLE_CONFIANCE_DEFAUT = ""
          privee, _ = sig.generer_paire(tmp / "k.pem", tmp / "k.pub")
          cle = sig.charger_cle_privee(privee)
          sig.ecrire_signature(aef, cle, identite="CI")

          # 3. boot : verification complete + signature validee
          kernel.CACHE = tmp / "cache"
          cfg = kernel.ouvrir_et_verifier(aef)
          assert cfg["n_ctx"] > 0
          print("Chaine .aef OK sur Linux :", cfg["build"])
          PY

      - name: Alteration detectee (un octet change = refus)
        env:
          PYTHONIOENCODING: utf-8
        run: |
          uv run --frozen python - <<'PY'
          import tempfile
          from pathlib import Path
          from scripts.forger_aef import forger
          from aura import kernel

          tmp = Path(tempfile.mkdtemp())
          faux = tmp / "faux.gguf"
          faux.write_bytes(bytes(range(256)) * 4096)
          aef = tmp / "ci.aef"
          forger(faux, aef)

          corrompu = tmp / "corrompu.aef"
          data = bytearray(aef.read_bytes())
          data[-100] ^= 0xFF
          corrompu.write_bytes(bytes(data))

          kernel.CACHE = tmp / "cache"
          try:
              kernel.ouvrir_et_verifier(corrompu)
          except ValueError as e:
              print("Alteration detectee comme prevu :", e)
          else:
              raise SystemExit("ECHEC : un fichier altere a ete accepte !")
          PY

  # Le typage est un INVARIANT annonce (badge « mypy : 0 ») : il est donc
  # verifie en CI. La version de mypy vient du VERROU (uv.lock), pas d'une
  # epingle recopiee ici : c'est la meme version qui a produit le 0 annonce.
  # `check_untyped_defs` vient de [tool.mypy] (pyproject.toml) : le corps des
  # fonctions NON annotees est verifie lui aussi. C'est cette ligne qui a fait
  # apparaitre 14 erreurs reelles — dont un `no-redef` et deux operandes `None`.
  # Ne PAS la retirer : le 0 du badge couvre aujourd'hui ces corps.
  typage:
    name: mypy (aura/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Dependances (metadonnees du projet, groupe dev inclus)
        run: uv sync --frozen

      # Un echec de typage DOIT dire ses erreurs ici. Sans cela, la raison d'un
      # job rouge n'existe que dans le journal du runner, illisible sans jeton
      # — c'est exactement ce qui a laisse ce job rouge et MUET pendant trois
      # semaines, alors que `mypy aura/` passe (0 erreur, 74 fichiers) sur un
      # poste de developpement. Le statut de sortie reste celui de mypy.
      - name: mypy aura/ (la version du verrou, dans le venv installe)
        env:
          PYTHONIOENCODING: utf-8
        shell: bash
        run: |
          # Le binaire du VENV, pas `uv run` : `uv run --frozen` peut echouer
          # (resolution, reconstruction de l'editable) AVANT d'executer mypy,
          # et son message ne contient pas d'erreur de typage — donc la boucle
          # ci-dessous n'annotait rien et le job restait MUET. Le venv, lui,
          # est celui que `uv sync --frozen` vient d'installer : rien a rejouer.
          if [ ! -x .venv/bin/mypy ]; then
            echo "::error::mypy absent du venv installe par 'uv sync --frozen' — il est pourtant dans le groupe dev de uv.lock"
            ls .venv/bin | head -20
            exit 1
          fi
          .venv/bin/mypy --version
          statut=0
          .venv/bin/mypy aura/ > mypy_sortie.txt 2>&1 || statut=$?
          cat mypy_sortie.txt
          if [ "$statut" -ne 0 ]; then
            if grep -qE ": (error|note):" mypy_sortie.txt; then
              grep -E ": (error|note):" mypy_sortie.txt | head -20 \
                | while IFS= read -r ligne; do echo "::error::$ligne"; done
            else
              # mypy tombe sans erreur de typage : c'est l'execution qui a
              # echoue. La sortie brute est publiee ici, sinon le job est
              # rouge et muet — ce qui a cache ce probleme trois semaines.
              echo "::error::mypy sort en $statut SANS erreur de typage : sortie brute"
              head -20 mypy_sortie.txt \
                | while IFS= read -r ligne; do echo "::error::[brut] $ligne"; done
            fi
          else
            # Trace lisible SANS jeton : ce que la CI a REELLEMENT execute.
            echo "::notice::$(.venv/bin/mypy --version) — $(cat mypy_sortie.txt)"
          fi
          exit "$statut"

  installateur:
    name: Syntaxe de l'installeur PowerShell
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérification de syntaxe (PSParser)
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.PSParser]::Tokenize(
            (Get-Content -Raw "scripts/installer.ps1"), [ref]$errors) | Out-Null
          if ($errors -and $errors.Count) {
            $errors | ForEach-Object {
              Write-Error "ligne $($_.Token.StartLine): $($_.Message)" }
            exit 1
          }
          Write-Host "Syntaxe de l'installeur : OK"

  # RUFF fait deux choses d'un coup. Le jeu de regles par DEFAUT attrape des
  # ERREURS (nom indefini, import mort, variable jamais lue, except nu), et
  # surtout `target-version = "py311"` REFUSE toute syntaxe plus recente que
  # le Python annonce par `requires-python`. C'est exactement la classe de bug
  # que mypy ne PEUT PAS voir (ses stubs numpy exigent 3.12) : une f-string
  # multiligne avait rendu `aura/llama_cerveau.py` incompilable pour tout
  # utilisateur en 3.11, sans qu'aucun controle ne s'en apercoive.
  lint:
    name: ruff (erreurs + compatibilite py311)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Dependances (metadonnees du projet, groupe dev inclus)
        run: uv sync --frozen

      - name: ruff check .
        run: uv run --frozen ruff check .

  # LE PLANCHER DE VERSION, verifie sur le plus ancien Python annonce.
  # `compileall` ne demande AUCUNE dependance : en quelques secondes il
  # prouve que tous les fichiers se laissent au moins PARSER par 3.11. Ruff
  # ne le remplace pas — il lit la grammaire de sa propre facon, alors que
  # ce job utilise le vrai interpreteur.
  compat-311:
    name: Python 3.11 (le plancher annonce)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Tous les .py compilent sous 3.11
        run: python -m compileall -q aura rontogpt tests scripts

  # AVIS DE SECURITE connus sur les versions FIGEES du verrou. Une dependance
  # qui gagne un avis fait echouer ce job, et c'est voulu : c'est le moment de
  # decider. DEUX avis sont acceptes aujourd'hui, chacun pour une raison
  # differente — et les deux doivent disparaitre des que possible :
  #
  # 1. `diskcache` (PYSEC-2026-2447, tire par llama-cpp-python) : AUCUNE
  #    version corrective n'est publiee, et le retirer voudrait dire retirer
  #    le moteur du cerveau.
  # 2. `opentelemetry-api` (CVE-2026-114603, tire par google-adk) : le
  #    correctif EXISTE (1.45.1) mais google-adk 2.13.0 epingle la 1.42.1, et
  #    `uv lock --upgrade-package` ne peut donc pas la faire monter. Le jour
  #    ou adk elargit son pin, retirer cette ligne : forcer la version par
  #    `override-dependencies` a la place d'adk reviendrait a parier qu'aucune
  #    API utilisee par l'ADK n'a change — pari qu'aucun test ne couvre ici.
  #
  # Ce que ce job a fait son travail : certifi, filelock (3 avis) et
  # setuptools ont ete MONTES dans uv.lock plutot qu'ignores.
  securite:
    name: Dependances figees (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Dependances (metadonnees du projet)
        run: uv sync --frozen

      - name: pip-audit (versions figees, avis corriges inclus)
        run: |
          # Le chemin est CALCULE par l'interpreteur du venv, jamais recopie
          # (`.venv/lib/python3.12/site-packages`) : un chemin fige redevient
          # faux des que la CI change de version de Python — et pip-audit sur
          # un dossier INEXISTANT ne trouve aucune vulnerabilite, donc le job
          # passerait au vert sans avoir rien verifie. Le `test -d` rend cet
          # echec bruyant (le shell des etapes est en `bash -e`).
          SP=$(.venv/bin/python -c \
            "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          test -d "$SP"
          echo "audit de $SP"
          uvx --from pip-audit==2.10.1 pip-audit --path "$SP" \
            --ignore-vuln PYSEC-2026-2447 \
            --ignore-vuln CVE-2026-114603

      # Le meme audit, EN LOCAL (Windows compris) : `python
      # scripts/audit_dependances.py`. Il calcule le `--path` du venv, epingle
      # la meme version de pip-audit, ignore le meme avis — et previent avant
      # les avis si le venv n'est pas le verrou. `pip-audit --no-deps -r`,
      # lui, ne peut pas aboutir ici : voir l'en-tete de ce script.

  # La TUI est du TypeScript, et son package.json declare `check: tsc
  # --noEmit` depuis toujours — mais AUCUNE CI ne l'appelait. Il passait donc
  # seulement parce que personne ne le lancait : le meme genre de faux
  # invariant que le badge mypy avant.
  tui:
    name: TUI TypeScript (tsc --noEmit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # `npm ci` et non `bun install` : le VERROU versionne du dossier tui/
      # est package-lock.json. Le postinstall de `bun` (devDependency) est
      # ignore par npm 11, ce qui est sans effet ici : on ne veut que `tsc`.
      - name: Installer (verrou npm)
        working-directory: tui
        run: npm ci

      - name: tsc --noEmit
        working-directory: tui
        run: npm run check
