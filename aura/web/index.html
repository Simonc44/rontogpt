<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RontoGPT</title>
<style>
:root{ --accent:#7C9EF5; --vert-ok:#4E9A52; --rouge:#E0453D; }
*{box-sizing:border-box;}
html,body{height:100%;margin:0;font-family:"Segoe UI",system-ui,sans-serif;user-select:none;}
body{background:transparent;}

/* ---------- fenêtre macOS néumorphique ---------- */
.mac-window{width:100vw;height:100vh;background:#e6e6e6;
  overflow:hidden;display:flex;flex-direction:column;}
.titlebar{height:48px;flex:none;display:flex;align-items:center;padding:0 16px;
  background:#e0e0e0;box-shadow:inset 4px 4px 10px #bcbcbc,inset -4px -4px 10px #ffffff;
  gap:16px;position:relative;cursor:grab;}
.dots{display:flex;gap:8px;}
.dot{width:13px;height:13px;border-radius:50%;cursor:pointer;border:0;padding:0;}
.dot.red{background:#ff5f57;} .dot.yellow{background:#febc2e;} .dot.green{background:#28c840;}
.titlebar .name{position:absolute;left:50%;transform:translateX(-50%);
  font-weight:700;font-size:13px;color:#3a3a3a;pointer-events:none;}
.status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;color:#9a9a9a;}
.status .puce{width:8px;height:8px;border-radius:50%;background:#9a9a9a;transition:background .3s;}
.status.pret .puce{background:var(--vert-ok);}
.status.erreur .puce{background:var(--rouge);}

.corps{flex:1;display:flex;min-height:0;}
.apercu{width:250px;flex:none;background:#e6e6e6;padding:18px 14px;
  box-shadow:inset -6px 0 10px -8px #bcbcbc;overflow-y:auto;}
.apercu h4{font-size:10px;letter-spacing:.06em;color:#9a9a9a;text-transform:uppercase;margin:14px 0 6px;}
.apercu .card{background:#e6e6e6;border-radius:14px;padding:10px 12px;font-size:12px;color:#4d4d4d;
  box-shadow:inset 2px 2px 6px #cfcfcf,inset -2px -2px 6px #ffffff;white-space:pre-line;}

.chat{flex:1;display:flex;flex-direction:column;min-width:0;position:relative;}
.messages{flex:1;overflow-y:auto;padding:20px 24px;display:flex;flex-direction:column;gap:10px;}
/* Messages sélectionnables (Ctrl+C copie la sélection) ; le reste de la
   fenêtre ne l'est pas, pour que le drag de la barre de titre reste fluide. */
.messages,.apercu .card{user-select:text;cursor:text;}
.ligne{display:flex;align-items:flex-start;gap:6px;width:100%;}
.ligne.toi{justify-content:flex-end;}
.ligne.toi .copier{order:-1;}
.bulle{max-width:70%;padding:10px 16px;border-radius:18px;font-size:13.5px;line-height:1.4;
  white-space:pre-wrap;}
.copier{flex:none;margin-top:6px;border:0;background:transparent;padding:2px 4px;
  border-radius:8px;font:inherit;font-size:10.5px;color:#9a9a9a;cursor:pointer;
  opacity:0;transition:opacity .15s,color .15s;}
.ligne:hover .copier,.copier:focus-visible{opacity:1;}
.copier:hover{color:#4d4d4d;background:#dcdcdc;}
.bulle.aura{align-self:flex-start;background:#eeeeee;color:#333;
  box-shadow:2px 2px 6px #cfcfcf,-2px -2px 6px #ffffff;}
.bulle.toi{align-self:flex-end;background:linear-gradient(135deg,#7c9ef5,#5a7ee8);color:#fff;}
.bulle.pensee{align-self:flex-start;background:#f7f7f8;color:#8a8f98;font-style:italic;
  font-size:12.5px;border:1px dashed #dcdee2;}
.meta{align-self:flex-start;font-size:10.5px;color:#9a9a9a;padding-left:6px;margin-top:-4px;}

.reflexion{align-self:flex-start;display:none;align-items:center;gap:8px;
  font-size:12px;color:#8d8d8d;padding-left:6px;}
.reflexion.actif{display:flex;}
.reflexion .pt{width:6px;height:6px;border-radius:50%;background:#be4a1d;animation:clignoter 1s infinite;}
.reflexion .pt:nth-child(2){animation-delay:.15s;}
.reflexion .pt:nth-child(3){animation-delay:.3s;}
@keyframes clignoter{0%,80%,100%{opacity:.25;}40%{opacity:1;}}

/* ---------- pied : champ + bouton flèche ---------- */
.pied{flex:none;padding:14px 18px;display:flex;align-items:center;gap:10px;}
.champ-wrap{flex:1;background:#e6e6e6;border-radius:24px;
  box-shadow:inset 3px 3px 8px #cfcfcf,inset -3px -3px 8px #ffffff;padding:4px 6px;}
.champ-wrap input{width:100%;border:0;background:transparent;outline:none;
  padding:10px 14px;font-size:13.5px;color:#333;font-family:inherit;}

.btn-envoyer{width:52px;height:52px;border-radius:50%;border:2px solid #4d4d4d;background:none;
  cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;
  transition:border-color .2s,background-color .2s;}
.btn-envoyer svg{width:20px;height:20px;stroke:#4d4d4d;transition:stroke .2s;}
.btn-envoyer:hover{border-color:#599a53;background:#599a53;}
.btn-envoyer:hover svg{stroke:#fff;}
.btn-envoyer:disabled{opacity:.4;cursor:default;}
.btn-envoyer:disabled:hover{border-color:#4d4d4d;background:none;}
.btn-envoyer:disabled:hover svg{stroke:#4d4d4d;}

/* ---------- page d'accueil (avant le premier message) ---------- */
.welcome{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:14px;text-align:center;padding:20px;}
.welcome .logo{width:88px;height:88px;border-radius:22px;
  box-shadow:6px 6px 16px #cfcfcf,-6px -6px 16px #ffffff;
  display:flex;align-items:center;justify-content:center;overflow:hidden;}
.welcome .logo img{width:100%;height:100%;object-fit:cover;display:block;}
.titlebar .logo-mini{width:26px;height:26px;border-radius:7px;overflow:hidden;flex:none;
  margin-right:2px;display:block;}
.titlebar .logo-mini img{width:100%;height:100%;object-fit:cover;display:block;}
.btn-doc{margin-top:8px;width:100%;border:0;border-radius:12px;padding:8px 10px;
  background:#e6e6e6;color:#4d4d4d;font:inherit;font-size:11.5px;cursor:pointer;
  box-shadow:3px 3px 8px #cfcfcf,-3px -3px 8px #ffffff;}
.btn-doc:hover{color:#2f2f2f;}
.btn-doc:disabled{opacity:.45;cursor:default;}
.doc-item{display:flex;align-items:center;justify-content:space-between;gap:6px;
  padding:3px 0;font-size:11.5px;}
.doc-item button{border:0;background:transparent;color:#b06a68;cursor:pointer;
  font:inherit;font-size:13px;line-height:1;padding:0 2px;}
.doc-item button:hover{color:#8d3b38;}
.welcome h2{margin:0;font-size:22px;color:#333;}
.welcome p{margin:0;font-size:13.5px;color:#8d8d8d;}
</style>
</head>

        <h2>Bonjour !</h2>
      </div>

      <div class="messages" id="messages" style="display:none;"></div>
      <div class="reflexion" id="reflexion">
        <span class="pt"></span><span class="pt"></span><span class="pt"></span>
        RontoGPT réfléchit...
      </div>

      <div class="pied">
        <div class="champ-wrap">
          <input id="saisie" type="text" placeholder="Écrire à RontoGPT..." autocomplete="off">
        </div>
        <button class="btn-envoyer" id="btn-envoyer" disabled title="Envoyer">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="4" y1="12" x2="20" y2="12"></line>
            <polyline points="13 5 20 12 13 19"></polyline>
          </svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
let iaPrete = false;
let occupe = false;

const elAccueil = document.getElementById('accueil');
const elMessages = document.getElementById('messages');
const elReflexion = document.getElementById('reflexion');
const elSaisie = document.getElementById('saisie');
const elBtnEnvoyer = document.getElementById('btn-envoyer');
const elStatut = document.getElementById('statut');
const elStatutTexte = document.getElementById('statut-texte');
const elApLignes = document.getElementById('ap-lignes');
const elApReponse = document.getElementById('ap-reponse');
const elDocListe = document.getElementById('doc-liste');
const elBtnDoc = document.getElementById('btn-doc-ajouter');

// ---------------- drag de la fenêtre (barre custom = pas de bordure OS) ----------------
(function () {
  const barre = document.getElementById('barre');
  let glisse = false, dx0 = 0, dy0 = 0;
  barre.addEventListener('mousedown', (e) => {
    if (e.target.closest('.dot')) return; // pas de drag en cliquant un bouton
    glisse = true; dx0 = e.screenX; dy0 = e.screenY;
  });
  window.addEventListener('mousemove', (e) => {
    if (!glisse) return;
    const dx = e.screenX - dx0, dy = e.screenY - dy0;
    dx0 = e.screenX; dy0 = e.screenY;
    if (window.pywebview) window.pywebview.api.deplacer(dx, dy);
  });
  window.addEventListener('mouseup', () => { glisse = false; });
})();

document.getElementById('btn-fermer').onclick = () => window.pywebview && window.pywebview.api.fermer();
document.getElementById('btn-reduire').onclick = () => window.pywebview && window.pywebview.api.reduire();
document.getElementById('btn-agrandir').onclick = () => window.pywebview && window.pywebview.api.agrandir();

// ---------------- évènements poussés depuis Python (chargement du cerveau) ----------------
let bulleStream = null;   // bulle de REPONSE en cours de remplissage
let bullePensee = null;   // bulle de REFLEXION en cours de remplissage

function afficherPret() {
  iaPrete = true;
  elBtnEnvoyer.disabled = false;
  elStatut.className = 'status pret';
  // Plus aucun texte de chargement une fois le cerveau prêt : la pastille
  // verte suffit, et la barre de titre redevient propre.
  elStatutTexte.textContent = '';
  elApLignes.textContent = 'Cerveau chargé.\nPosez votre question.';
  void rafraichirDocuments();
}

function afficherErreur(message) {
  elStatut.className = 'status erreur';
  elStatutTexte.textContent = 'erreur';
  ajouterMessageInfo('[erreur] ' + message);
}

window.auraEvenement = function (evenement, donnees) {
  if (evenement === 'aura_pret') {
    afficherPret();
  } else if (evenement === 'morceau') {
    // DEUX FLUX EN PARALLÈLE : la réflexion du modèle, puis sa réponse.
    // Chacune a sa propre bulle — les concaténer revenait à mélanger le
    // brouillon et la réponse, et l'utilisateur ne savait plus laquelle
    // était la sienne.
    if (donnees.phase === 'pensee') {
      if (!bullePensee) {
        masquerAccueil();
        bullePensee = ajouterBulle('', 'pensee');
      }
      bullePensee.textContent += donnees.texte;
    } else {
      if (!bulleStream) {
        masquerAccueil();
        bulleStream = ajouterBulle('', 'aura');
      }
      bulleStream.textContent += donnees.texte;
    }
    elMessages.scrollTop = elMessages.scrollHeight;
  } else if (evenement === 'aura_erreur') {
    afficherErreur(donnees.message);
  }
};

// ---------------- bulles de chat ----------------
function masquerAccueil() {
  if (elAccueil.style.display === 'none') return;
  elAccueil.style.display = 'none';
  elMessages.style.display = 'flex';
}

async function copierTexte(texte, bouton) {
  let ok = false;
  // 1. API presse-papiers (contexte sécurisé).
  try { await navigator.clipboard.writeText(texte); ok = true; } catch (e) { ok = false; }
  // 2. Repli : le document local n'est pas toujours un contexte sécurisé.
  if (!ok) {
    const zone = document.createElement('textarea');
    zone.value = texte;
    zone.setAttribute('readonly', '');
    zone.style.cssText = 'position:fixed;top:0;left:0;opacity:0;pointer-events:none;';
    document.body.appendChild(zone);
    zone.select();
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    zone.remove();
  }
  if (bouton) {
    const avant = bouton.textContent;
    bouton.textContent = ok ? 'copié ✓' : 'impossible';
    setTimeout(() => { bouton.textContent = avant; }, 1200);
  }
  return ok;
}

function ajouterBulle(texte, qui) {
  // Un message = une ligne (bulle + bouton « copier »), pour que le bouton
  // reste hors du texte : le flux en direct réécrit `b.textContent`.
  const ligne = document.createElement('div');
  ligne.className = 'ligne ' + qui;
  const b = document.createElement('div');
  b.className = 'bulle ' + qui;
  b.textContent = texte;
  const bouton = document.createElement('button');
  bouton.className = 'copier';
  bouton.type = 'button';
  bouton.title = 'Copier ce message';
  bouton.textContent = 'copier';
  bouton.addEventListener('click', () => { void copierTexte(b.textContent, bouton); });
  ligne.appendChild(b);
  ligne.appendChild(bouton);
  elMessages.appendChild(ligne);
  elMessages.scrollTop = elMessages.scrollHeight;
  return b;
}

/** Retire la bulle et sa ligne (le bouton « copier » part avec elle). */
function retirerBulle(b) {
  if (!b) return;
  const ligne = b.closest('.ligne');
  (ligne || b).remove();
}

function ajouterMessageInfo(texte) {
  masquerAccueil();
  const m = document.createElement('div');
  m.className = 'meta';
  m.textContent = texte;
  elMessages.appendChild(m);
  elMessages.scrollTop = elMessages.scrollHeight;
}

// ---------------- documents locaux (RAG) ----------------
function afficherDocuments(fichiers) {
  elDocListe.textContent = '';
  if (!fichiers || fichiers.length === 0) {
    elDocListe.textContent = 'Aucun document.';
    return;
  }
  for (const fichier of fichiers) {
    const ligne = document.createElement('div');
    ligne.className = 'doc-item';
    const nom = document.createElement('span');
    nom.textContent = fichier.nom;
    nom.title = (fichier.morceaux || 0) + ' morceau(x)';
    const bouton = document.createElement('button');
    bouton.type = 'button';
    bouton.title = 'Retirer ' + fichier.nom;
    bouton.textContent = '×';
    bouton.addEventListener('click', async () => {
      if (!window.pywebview) return;
      const r = await window.pywebview.api.documents_supprimer(fichier.nom);
      if (r.ok) afficherDocuments(r.fichiers);
      else elDocListe.textContent = 'Erreur : ' + r.erreur;
    });
    ligne.appendChild(nom);
    ligne.appendChild(bouton);
    elDocListe.appendChild(ligne);
  }
}

async function rafraichirDocuments() {
  if (!window.pywebview || !window.pywebview.api) return;
  try {
    const r = await window.pywebview.api.documents_liste();
    if (r.ok) afficherDocuments(r.fichiers);
    else elDocListe.textContent = 'Indisponible : ' + r.erreur;
  } catch (e) {
    elDocListe.textContent = 'Indisponible : ' + e;
  }
}

elBtnDoc.addEventListener('click', async () => {
  if (!window.pywebview || !window.pywebview.api) return;
  elBtnDoc.disabled = true;
  try {
    const r = await window.pywebview.api.documents_ajouter();
    if (r.ok) {
      afficherDocuments(r.fichiers);
      if (r.erreurs && r.erreurs.length > 0) {
        elDocListe.textContent += '\nNon ajouté : ' + r.erreurs.join(' ; ');
      }
    } else if (r.erreur !== 'annule') {
      elDocListe.textContent = 'Erreur : ' + r.erreur;
    }
  } finally {
    elBtnDoc.disabled = false;
  }
});

// Le cerveau se charge en tache de fond : `aura_pret` peut partir avant que
// cette page n'ait defini `auraEvenement`, et l'evenement serait perdu. Ce
// sondage garantit que « chargement... » disparait des que le cerveau est pret.
async function suivreDemarrage() {
  if (iaPrete || !window.pywebview || !window.pywebview.api) return;
  try {
    const e = await window.pywebview.api.etat();
    if (e && e.prete) { afficherPret(); return; }
    if (e && e.erreur) { afficherErreur(e.erreur); return; }
  } catch (erreur) {
    // API pas encore exposee : on reessaie.
  }
  setTimeout(suivreDemarrage, 1000);
}

window.addEventListener('pywebviewready', () => {
  void rafraichirDocuments();
  void suivreDemarrage();
});

function afficherReflexion(actif) {
  elReflexion.classList.toggle('actif', actif);
  if (actif) elMessages.scrollTop = elMessages.scrollHeight;
}

// ---------------- envoi d'une question ----------------
async function envoyer() {
  const question = elSaisie.value.trim();
  if (!question || !iaPrete || occupe) return;
  occupe = true;
  elBtnEnvoyer.disabled = true;
  elSaisie.value = '';
  masquerAccueil();
  ajouterBulle(question, 'toi');
  elStatutTexte.textContent = 'réflexion...';
  afficherReflexion(true);
  bulleStream = null;   // une nouvelle question = une nouvelle bulle
  bullePensee = null;

  try {
    const r = await window.pywebview.api.envoyer(question);
    afficherReflexion(false);
    if (r.ok) {
      // la réponse finale (post-traitée) remplace le flux en direct
      retirerBulle(bulleStream); bulleStream = null;
      retirerBulle(bullePensee); bullePensee = null;
      ajouterBulle(r.reponse, 'aura');
      const experts = (r.experts && r.experts.length) ? r.experts.join(', ') : '-';
      ajouterMessageInfo('experts ' + experts + ' · ' + r.latence + ' s');
      elApLignes.textContent = 'Experts : ' + experts + '\nCerveau : ' + r.cerveau + '\nLatence : ' + r.latence + ' s';
      elApReponse.textContent = r.reponse.slice(0, 1500);
    } else {
      ajouterMessageInfo('[erreur] ' + r.erreur);
    }
  } catch (e) {
    afficherReflexion(false);
    ajouterMessageInfo('[erreur] ' + e);
  }

  elStatutTexte.textContent = '';
  elBtnEnvoyer.disabled = false;
  occupe = false;
  elSaisie.focus();
}

elBtnEnvoyer.addEventListener('click', envoyer);
elSaisie.addEventListener('keydown', (e) => { if (e.key === 'Enter') envoyer(); });
elSaisie.focus();
</script>
