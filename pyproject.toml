[project]
name = "aura-1b"
version = "0.3.0"
description = "IA hybride neuro-symbolique : orchestrateur LLM + expert symbolique (PGS) + memoire web (RAG)"
# LICENCE (arbitrage) : le depot a porte DEUX licences contradictoires —
# `LICENSE` en GPL-3.0, `LICENSE.mit.txt` en MIT, et un CONTRIBUTING qui
# annoncait MIT. C'est le fichier `LICENSE` qui fait foi : GPL-3.0-or-later.
# `license-files` embarque le texte dans la wheel : sans lui, `pip show`
# n'affichait AUCUNE licence.
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Simon Chusseau", email = "simon.chusseau@gmail.com" }]
# `readme` : sans lui la wheel n'avait aucune description longue (twine
# avertissait `long_description missing`) et la page du paquet restait vide.
readme = "README.md"
requires-python = ">=3.11"  # tomllib (aura/config.py) n'existe qu'a partir de 3.11
dependencies = [
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "joblib>=1.3",
    "gplearn>=0.4.2",
    "ddgs>=9.0",
    "requests>=2.31",
    # 0.3.2 ne sait PAS lire l'architecture `gemma3` (le cerveau par defaut) :
    # `llama_model_load_from_file` echoue et tout le chemin in-process devient
    # inutilisable. 0.3.36 est la premiere version de la serie a embarquer un
    # llama.cpp assez recent pour gemma3 ; la wheel win_amd64 est prebuild
    # (index abetlen), donc aucun compilateur n'est requis.
    "llama-cpp-python==0.3.36",
    "huggingface-hub>=0.25",
    "pypdf>=5.0",  # RAG documents locaux (aura/documents.py) : lecture PDF

    "cryptography>=50.0.1",
    "onnxruntime>=1.24.3",
    "tokenizers>=0.23.2",
    "google-adk>=2.12.0",  # agents ADK opt-in (AURA_ADK=1) : aura/agents_adk.py
]

[project.scripts]
rontogpt = "aura.__main__:main"
aura = "aura.__main__:main"  # alias historique

[project.urls]
Homepage = "https://github.com/Simonc44/rontogpt"
Repository = "https://github.com/Simonc44/rontogpt"
Issues = "https://github.com/Simonc44/rontogpt/issues"

[project.optional-dependencies]
mamba = ["torch>=2.2", "transformers>=4.46"]
rwkv_legacy = ["rwkv>=0.8", "tiktoken>=0.5"]
interp = ["torch>=2.2", "transformers>=4.46", "transformer_lens>=2.0"]

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=8.0",
    # Ordre ALEATOIRE des tests : la suite doit rester verte dans n'importe
    # quel ordre. Sans ce plugin, un etat de module partage entre tests ne se
    # voit QUE dans l'ordre alphabetique des fichiers — c'est ainsi que 8
    # echecs fantomes ont survecu sur `main` (cf. tests/conftest.py).
    "pytest-randomly>=5.0",
    "mypy>=1.10",
    # Linter + garde-fou de version : `target-version = "py311"` (voir
    # [tool.ruff]) refuse toute syntaxe plus recente que le Python annonce
    # par `requires-python`. C'est ce qui manquait quand
    # `aura/llama_cerveau.py` est devenu incompilable sous 3.11.
    "ruff>=0.17",
    # La couverture : le projet annoncait des chiffres SANS jamais la mesurer.
    # Sans ce paquet, « 20 % » etait une impression, pas une mesure — et un
    # module que plus rien n'exerce (`aura/routeur.py` : 62 % sur trois tests,
    # 13 % sur la suite complete, voir ARCHITECTURE.md) passe inapercu.
    "pytest-cov>=7.0",
]

[[tool.uv.index]]
name = "abetlen-cpu"
url = "https://abetlen.github.io/llama-cpp-python/whl/cpu/"

[tool.uv.sources]
llama-cpp-python = { index = "abetlen-cpu" }

[tool.uv]
# CVE-2026-114603 : `TraceState.from_header` (opentelemetry-api) a un cout
# CPU quadratique sur un en-tete W3C `tracestate` malforme, et la version
# corrigee est 1.45.1. `google-adk` 2.13.0 — la DERNIERE publiee — declare
# `opentelemetry-api<=1.44`, donc le verrou restait bloque sur 1.42.1 et
# l'avis etait ignore dans l'audit. On force ici la version corrigee.
#
# Ce qui a ete verifie, et qui manquait la derniere fois : la chaine ADK
# tourne pour de vrai sous 1.45.1 (`tests/test_agents_adk.py` monte un
# SequentialAgent dans un InMemoryRunner, modele local simule). Le jour ou
# `google-adk` elargit son pin, retirer ce bloc : il ne sert qu'a ca.
# Les deux paquets doivent bouger ensemble, `opentelemetry-sdk` exige
# `opentelemetry-api==<sa propre version>`.
override-dependencies = [
    "opentelemetry-api==1.45.1",
    "opentelemetry-sdk==1.45.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# `rontogpt` porte le nom public : sans lui dans la wheel, `python -m rontogpt`
# marcherait depuis la racine du depot (CWD dans sys.path) mais pas une fois
# le projet installe.
packages = ["aura", "rontogpt"]
# DONNEES DE RACINE : le code les lit par le PARENT du paquet
# (`Path(__file__).resolve().parent.parent`) — aura/concepts.py,
# aura/adaptateurs.py, aura/tui.py. Les inclure a la RACINE de la wheel
# reproduit donc exactement la disposition du depot une fois le projet
# installe. Sans elles, un `pip install` livrait un RontoGPT degrade : sans
# concepts.toml (bibliotheque de concepts), sans adaptateurs/ (hot-swap LoRA,
# fichiers langue) et sans tui/ (interface terminal).
# `only-include` et non `include` : avec `packages`, hatchling ignore
# `include` (verifie — la wheel ne contenait que aura/ et rontogpt/).
only-include = ["aura", "rontogpt", "concepts.toml", "skills.toml", "identite.toml", "adaptateurs", "tui"]
# Les deux seuls contenus volumineux et regenerables : le cache Bun de la TUI
# et les adaptateurs Llama 3.2 archives (le code lit les .gguf/.cvec de la
# racine de `adaptateurs/`).
exclude = ["tui/node_modules", "adaptateurs/_archive_llama_3.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
# Cible : le paquet LIVRE (jamais les tests ni les scripts de banc).
branch = true
source = ["aura", "rontogpt"]

[tool.coverage.report]
# Ce qui n'est PAS executable sous pytest ne doit pas compter comme manque :
# les declarations de typage (`if TYPE_CHECKING:`) et le point d'entree script.
# Les compter ferait baisser le chiffre sans qu'AUCUN test puisse le remonter —
# un trou que personne ne peut boucher n'est pas un trou.
exclude_also = [
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
]

[tool.ruff]
# Cible : le PLUS ANCIEN Python supporte (`requires-python`). Indispensable :
# ruff rapporte en `invalid-syntax` ce qui ne compile pas sous cette version
# (par ex. une f-string multiligne, PEP 701, valide seulement en 3.12) — la
# classe de bug que mypy ne peut PAS voir, ses stubs numpy exigeant 3.12.
# C'est exactement ainsi que `aura/llama_cerveau.py` est reste casse sous 3.11.
target-version = "py311"
extend-exclude = [
    ".cache_aef",
    "dist",
    "adaptateurs",
    "tui/node_modules",
    # Les notebooks Colab (`scripts/colab_lora_gemma.ipynb`) ne sont ni livres
    # ni executes par la suite : les regles de style dans leurs cellules ne
    # regardent personne. Si l'un devient un vrai livrable, retirer cette
    # ligne plutot que de le laisser hors du filet.
    "*.ipynb",
]

[tool.ruff.lint]
# Jeu par DEFAUT de ruff (E4/E7/E9 + F). Il ne juge pas le style, il attrape
# des erreurs : nom indefini, import inutilise, variable jamais lue, except nu.
# Pas de E501 volontairement : une ligne longue n'est pas un bug.
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
# 3.12 et NON 3.11, bien que `requires-python` annonce 3.11 : les stubs de
# numpy utilisent `type X = ...` (PEP 695), que mypy refuse de lire sous
# 3.11 — `mypy --python-version 3.11` s'arrete sur numpy lui-meme. Ce n'est
# donc PAS mypy qui garde la compatibilite 3.11 : c'est ruff, dont le
# `target-version = "py311"` refuse toute syntaxe plus recente.
python_version = "3.12"
# Les corps de fonctions NON annotees sont verifies eux aussi. Sans ce
# reglage, mypy affichait des `annotation-unchecked` et laissait passer, dans
# ces corps, des erreurs qu'il refusait ailleurs (`attr-defined`,
# `no-redef`, operandes `None`) : 14 d'entre elles ont ete corrigees pour
# activer cette ligne. Le badge « mypy : 0 » couvre donc desormais ces corps.
check_untyped_defs = true
# Stubs absents pour les libs scientifiques : on n'insiste pas dessus.
[[tool.mypy.overrides]]
module = [
    "sklearn.*", "joblib.*", "scipy.*", "gplearn.*",
    "ddgs.*", "duckduckgo_search.*", "llama_cpp.*",
    "chiffrement", "signature", "kernel",
]
ignore_missing_imports = true

# `datasets` (HF) merite son PROPRE bloc : pas de py.typed, et
# `load_dataset` n'est pas dans __all__ (reexport dynamique), donc mypy croit
# qu'il n'existe pas. `ignore_missing_imports` ne suffit pas pour un paquet
# dont la SOURCE est presente — mypy l'analyse. `follow_imports = "skip"` le
# rend opaque. Bloc separe VOLONTAIREMENT : mis dans le bloc ci-dessus, le
# `skip` relacherait aussi sklearn/scipy, ou mypy voit pourtant du vrai code.
# Utilise par scripts/mesure_gsm8k_aura.py.
[[tool.mypy.overrides]]
module = ["datasets", "datasets.*"]
follow_imports = "skip"
